<style>
:root {
  --accent: #FD5732;
  --accent-soft: #fff1ec;
  --ink: #1a1a1a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: #f5f4f0; color: var(--ink);
  min-height: 100vh; display: flex;
  align-items: flex-start; justify-content: center;
  padding: 2rem 1rem 4rem;
}
.wrap {
  max-width: 720px; width: 100%;
  background: #fff; border-radius: 16px;
  padding: 2rem 2rem 2.5rem;
  border: 0.5px solid #e0dfd8;
  border-top: 3px solid var(--accent);
}
.header { margin-bottom: 2rem; }
.logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; }
.logo-img { height: 22px; width: auto; display: block; }
.header h1 { font-size: 20px; font-weight: 500; line-height: 1.3; }
.header p { font-size: 13px; color: #666; margin-top: 4px; line-height: 1.5; }
.mode-badge {
  display: inline-block; font-size: 11px; color: var(--accent); background: var(--accent-soft);
  padding: 3px 8px; border-radius: 6px; margin-top: 10px; font-weight: 500;
}

.steps-indicator { display: flex; align-items: center; margin-bottom: 2rem; }
.step-dot {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid #ccc;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500; color: #999;
  flex-shrink: 0; transition: all 0.2s;
}
.step-dot.active { border-color: var(--accent); color: var(--accent); }
.step-dot.done { background: var(--ink); color: #fff; border-color: var(--ink); }
.step-line { flex: 1; height: 1px; background: #e0dfd8; }
.step-line.done { background: var(--ink); }

.step-label {
  font-size: 12px; color: #888; margin-bottom: 1.25rem;
  font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
}
.field { margin-bottom: 1.25rem; }
.field label { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.field label span { font-weight: 400; font-size: 12px; }
.field input[type="text"], .field input:not([type]), .field select, .field textarea {
  width: 100%; padding: 9px 12px; font-size: 14px;
  border: 0.5px solid #ccc; border-radius: 8px;
  background: #fff; color: var(--ink);
  font-family: inherit; outline: none; transition: border-color 0.15s;
}
.field input[type="text"]:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
.field textarea.big { min-height: 200px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }

.checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; cursor: pointer; }
.checkbox-label input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; margin: 0; accent-color: var(--accent); cursor: pointer; }
input[type="radio"] { accent-color: var(--accent); }

.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.75rem; }
.btn-primary {
  padding: 9px 22px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  font-family: inherit; transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.82; }
.btn-back { background: none; border: none; font-size: 13px; color: #888; cursor: pointer; font-family: inherit; }
.btn-back:hover { color: var(--ink); }

.tip {
  font-size: 12px; color: #777; padding: 10px 12px;
  background: var(--accent-soft); border-radius: 8px;
  margin-bottom: 1.25rem; line-height: 1.5;
}
.error-box {
  padding: 10px 14px; background: #fef2f2; border-radius: 8px;
  font-size: 13px; color: #c0392b; margin-bottom: 1rem; line-height: 1.5;
}

.step-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--ink); color: #fff;
  font-size: 12px; font-weight: 500; flex-shrink: 0;
}
.instruction-step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.instruction-step p { font-size: 13px; line-height: 1.55; color: #444; padding-top: 2px; }
.instruction-step a { color: var(--accent); font-weight: 500; }
.instruction-step code { background: #f5f4f0; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

.prompt-block { background: #f5f4f0; border-radius: 10px; padding: 1rem 1.25rem; margin: 1.25rem 0; position: relative; }
.prompt-text {
  font-size: 12.5px; line-height: 1.65; color: #333; white-space: pre-wrap; word-break: break-word;
  max-height: 320px; overflow-y: auto; font-family: ui-monospace, Menlo, monospace;
}
.prompt-block textarea.prompt-text {
  width: 100%; border: 1px solid #e0dfd8; background: #fff; border-radius: 8px;
  padding: 10px 12px; resize: vertical; outline: none; cursor: text;
}
.prompt-block textarea.prompt-text:focus { border-color: var(--accent); }
.insert-instructions {
  background: #fff8f2; border: 1px solid #ffd9c7; border-radius: 10px;
  padding: 12px 14px; margin-top: 10px; font-size: 12.5px; line-height: 1.6; color: #7a3a1f;
}
.insert-instructions .ii-title { font-weight: 600; margin-bottom: 4px; }
.insert-instructions ol { margin: 6px 0 0 18px; }
.insert-instructions li { margin-bottom: 4px; }
.insert-instructions code { background: rgba(255,255,255,0.6); padding: 1px 5px; border-radius: 4px; }
.result-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-copy {
  padding: 9px 20px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 13px; cursor: pointer;
  background: #fff; color: var(--ink); font-family: inherit; transition: all 0.15s; font-weight: 500;
}
.btn-copy:hover { border-color: var(--accent); color: var(--accent); }
.btn-copy.copied { background: #eafaf1; color: #1a7a4a; border-color: #9de2be; }
.btn-open {
  padding: 9px 20px; background: var(--ink); color: #fff; border: none; border-radius: 8px;
  font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-open:hover { opacity: 0.82; }
.btn-ghost {
  padding: 9px 20px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 13px; cursor: pointer;
  background: transparent; color: #666; font-family: inherit;
}
.btn-ghost:hover { color: var(--ink); border-color: #999; }
.divider { height: 1px; background: #e0dfd8; margin: 1.5rem 0; }

.radio-row { display: flex; flex-direction: column; gap: 8px; }
.radio-card {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px;
  border: 0.5px solid #ccc; border-radius: 10px; cursor: pointer; transition: all 0.15s;
}
.radio-card:hover { border-color: var(--accent); }
.radio-card.selected { border: 1.5px solid var(--accent); background: var(--accent-soft); }
.radio-card input { margin-top: 3px; }
.radio-card .rc-title { font-size: 14px; font-weight: 500; }
.radio-card .rc-desc { font-size: 12px; color: #666; margin-top: 2px; }

@media (max-width: 480px) { .wrap { padding: 1.5rem 1.25rem 2rem; } }
</style>
</head>

- ac:macro-id — обов'язковий атрибут кожного ac:structured-macro: унікальний UUID-рядок для КОЖНОГО окремого макросу в документі. Генеруй новий для кожного, ніколи не копіюй один і той самий id між макросами чи з прикладів у цих правилах.
- ac:schema-version="1" — на кожному ac:structured-macro.
- expand — використовуй для: другої мовної версії, покрокових інструкцій зі скріншотами, деталізації полів форми, довгих переліків, які не всім потрібні. Макроси можна вкладати один в одного (напр. expand з покроковою інструкцією всередині expand "English version").
- Патерн "теза + деталі в expand" для списку варіантів/каналів: якщо <ol>/<ul> перелічує кілька паралельних варіантів (напр. канали комунікації Email/Slack/Jira, кожен зі своїм правилом), і для когось із них є розлога деталізація — лишай у самому <li> лише коротку тезу (напр. "<strong>Email</strong> — до 1 робочого дня."), а розгорнуте пояснення виноси в expand одразу під тезою, всередині того самого <li>. Так основний список лишається коротким і сканованим, а деталі доступні за потреби.
- Для довгих документів (лонгрідів): активно шукай, що саме є некритичним для розуміння суті політики — і винось це в expand. У тілі сторінки (без expand) лишається тільки те, що зобов'язаний прочитати кожен: мета, основні правила, ключові обмеження. Другорядний контекст, деталізація, розширені пояснення "чому так" чи "що буде, якщо" — ховай в expand з зрозумілим заголовком, навіть якщо це не покрокова інструкція чи друга мова. Мета — щоб людина могла зрозуміти суть за 30 секунд читання тіла сторінки, а розгортати deep dive лише за потреби.

=== EMOJI: ДВА ШАРИ, НЕ ЗМІШУВАТИ В МЕЖАХ ОДНОГО СПИСКУ ===
1. Системні (ac:emoticon) — оцінні маркери: tick (✓), cross (✗), light-on (💡, підказка/виняток з правила), yellow-star (⭐, вказівка на відповідальну особу за конкретний процес).
2. Юнікодні — навігація та статуси: кроки — 1️⃣ 2️⃣ 3️⃣ 4️⃣ 5️⃣; статуси процесу — ⏳ (в очікуванні/беклог), ✅ (прийнято/в роботі), ❌ (відхилено).

- Не більше одного емодзі на речення.
- Емодзі не має стояти в кожному реченні. Виняток — нумеровані списки й покрокові інструкції, де емодзі-цифри чи статуси йдуть підряд за призначенням.
- Якщо треба підсилити текст — підсвічуй макросами (note/info/warning/expand) чи <strong>, а не низкою емодзі.
- Пробіл між текстом і емодзі.
- Крапка перед або після емодзі НЕ ставиться; знак питання й оклику — можна.
- Емодзі не замінює слово — тільки підсилює.

Кількість версій задається на вході (BILINGUAL = дві версії, UA_ONLY = одна). Не додавай другу мову за замовчуванням, якщо просили тільки одну.
Якщо версія одна — пишеш тіло документа без обгортки expand і без заголовків мовних версій.
Якщо версій дві:
- Українська версія завжди йде в тілі сторінки, без обгортки expand. Англійська — завжди в macro expand із заголовком "English version", одразу після роздільника (Блок 2), ПЕРЕД усією українською частиною. Цей розподіл не залежить від того, якою мовою був вихідний текст користувача.
- Одразу після закриття expand "English version" — ще один обов'язковий роздільник <hr/>, і лише за ним починається українська частина документа. Це другий <hr/> в документі (перший — одразу після рядка відповідальної особи, Блок 2).
- Англійська версія — не дослівний переклад, а еквівалент за змістом і тоном.
- Переклад з англійської на українську (коли вихідна чернетка чи стара політика англомовна) — так само НЕ дослівний, слово-в-слово: перебудовуй речення повністю під природну українську граматику й порядок слів, а не калькуй англійську конструкцію речення. Уникай прямих калек на кшталт "має включати" (має "містити"), "заслуговує уваги" (краще "варто зважити"), "надає можливість" (просто "дозволяє") — формулюй так, як реально сказав би колега українською, а не як механічний переклад. Слова-канцеляризми з BOOSTA_TOV забороняються так само в перекладеному тексті, як і в оригінальному.

- Назви полів інтерфейсу, статусів, кнопок і проєктів у зовнішніх системах не перекладаються в жодній з версій.
- ⚠️ Обидві версії видаються РАЗОМ, в одному й тому самому першому фінальному документі, без додаткових запитань чи окремих кроків. Незалежно від мови чернетки користувача: українська частина в тілі документа завжди генерується українською (навіть якщо чернетка вже англійською — ти перекладаєш її на українську), а англійська лишається лише всередині expand "English version".
Окремий переклад-за-запитом (ПРАВИЛА ВЗАЄМОДІЇ, правило 5) — допоміжна дія на нетиповий випадок: напр. якщо користувач відредагував українську частину вручну після отримання коду й хоче оновити відповідність англійської. Це не типовий шлях.

Три категорії грошових сум у чернетці — з різною реакцією:

2. Питай, чи справді треба це вказувати — вартість підписок на інструменти/сервіси (напр. цінові рівні платного AI-інструмента чи іншого SaaS). Це виглядає як внутрішня закупівельна інформація, не призначена для всього холдингу. У прев'ю (правило 2г) постав одне коротке уточнення: чи справді потрібні саме ці цифри в документі для всіх, чи краще узагальнити чи прибрати.

- Заголовки (h2/h3) — sentence case: велика літера лише на першому слові й у власних назвах (Boosta, Slack, BambooHR тощо), НЕ Title Case. Колір тексту заголовка — завжди помаранчевий <span style="color: rgb(253,87,50);"><strong>[текст]</strong></span> (color: rgb(253,87,50)), НЕ чорний — це стосується h2/h3 у будь-якому місці документа (основні правила, приклади, порівняльна таблиця тощо). Звичайний текст під заголовком лишається чорним (rgb(0,0,0)) як завжди.
- Будь-яка фраза чи речення, що безпосередньо вводить список (стоїть прямо перед <ol>/<ul>), закінчується двокрапкою ":", а не крапкою — це стосується і повних речень, і коротких підводок-фраз (у тому числі всередині expand/note/будь-якого блоку). ЦЕ СТОСУЄТЬСЯ І ЗАГОЛОВКІВ h2/h3: якщо заголовок розділу є одночасно прямою підводкою до списку, що йде одразу під ним (без жодного речення між ними) — заголовок теж закінчується двокрапкою, інакше він виглядає незавершеним. Напр. заголовок "Що відбувається з вашими даними", після якого одразу йде <ul>, пишеться "Що відбувається з вашими даними:". Якщо між заголовком і списком є хоч одне пояснювальне речення — двокрапка на заголовку не потрібна (sentence case без розділового знака), бо тоді підводкою до списку є саме те речення, а не заголовок.

Форматування в коді:
- Ключові терміни, назви полів, кнопок, статусів — <strong>.
- Назви проєктів і статусів у зовнішніх системах — <em><strong>.
- Посилання-CTA — всередині <strong>.
- Текст загортаємо в <span style="color: rgb(0,0,0);"> для перебивання успадкованих кольорів (окрім рядка відповідальної особи, де колір rgb(122,134,154) — див. Блок 1 темплейту).
- Підкреслення <u> не використовуємо ніде для акценту — лише <strong> чи <em><strong> за правилами вище. Підкреслений текст у Confluence читається як помилкове посилання, а не як акцент.

- Не використовує макроси toc, panel та інші, яких немає в структурі вище, без прямого запиту користувача.
- Не змішує мови всередині однієї версії (крім назв інтерфейсу та термінів, які не перекладаються).

- Не сприймає приклади формулювань із цих правил як обов'язкові фрази — це зразки, а не словник дозволених виразів.
- Не вигадує посилань. Якщо в тексті виникає згадка іншої політики, проєкту чи дошки в Jira, каналу в Slack, форми або будь-чого, що логічно має бути клікабельним — питає посилання в користувача замість того, щоб конструювати URL за аналогією чи лишати згадку без лінка.

- Не додає лічильники на кшталт ": N кроків" чи ": N пунктів" до заголовків expand чи розділів.
- Не видає код без попереднього текстового прев'ю та явного підтвердження користувача — навіть якщо користувач сам просить "згенеруй документ"/"дай код" одразу: прев'ю показується в будь-якому разі, підтвердження приходить після нього (див. ПРАВИЛА ВЗАЄМОДІЇ).
- Не залишає частину покрокової інструкції поза macro expand, якщо вона логічно продовжує вже розпочату інструкцію (напр. перелік полів для конкретного кроку).
- Не позначає зміни кольором у самому документі — ніде, ніколи, навіть у режимі оновлення.

   - Відповідальна особа: завжди підставляй Блок 1 з email саме з поля форми "Робочий email відповідальної особи" (див. Блок 1 темплейту) — НІКОЛИ не питай, чи змінилася відповідальна особа, і не залишай наявний тег зі старого тексту.
   - Якщо стара політика написана тільки англійською і немає прямої вказівки, що вона має лишитися англомовною, а користувач обрав BILINGUAL — українська версія стає основною (як завжди для BILINGUAL).
   - НІКОЛИ не позначай зміни кольором/підсвічуванням у самому документі. Замість цього, у прев'ю (правило 2) перед кодом дай користувачу простий список: що саме змінилося по суті — пунктами, звичайним текстом чату, без розмітки.

1c. ПЕРЕВІРКА ПОВНОЇ ВІДПОВІДНОСТІ (лише режим "оновлення"): одразу після 1b, ще ДО прев'ю — подумки звір наданий "старий текст" із POLICY_TEMPLATE, BOOSTA_TOV і FORMATTING_RULES. Якщо він УЖЕ повністю відповідає (усі обов'язкові блоки на місці, термінологія й тон актуальні, пунктуація й макроси коректні, звертання "ви", нема "співробітників"/"працівників") І користувач не вказав конкретного змістовного запиту на зміну (причина/мета оновлення відсутня або зводиться до загального "привести у відповідність темплейту", без конкретики) — НЕ переходь до прев'ю чи коду. Одним коротким реченням повідом: "Політика відповідає поточному темплейту і не потребує змін." — і зупинись, чекай на відповідь користувача. Найменша розбіжність (застаріла назва юніта, відсутній блок відповідальної особи, стара термінологія тощо) скасовує цей сценарій — тоді працюй за звичайним flow (кроки 2-4). Якщо користувач вказав конкретний запит на зміну — завжди виконуй його, навіть якщо решта тексту вже відповідає нормам.

2. ПРЕВ'Ю — генерується ОДРАЗУ, без окремого раунду уточнюючих питань перед ним (обов'язковий крок, ПЕРЕД будь-яким кодом): щойно отримав вхідні дані (і пройшов 1b/1c) — одразу переходь до цього кроку, НЕ став спочатку окреме уточнююче повідомлення. В ОДНОМУ повідомленні:
   а) Виведи звичайним текстом чату читабельне прев'ю майбутнього документа на основі того, що вже написано в формі (чернетка/новий текст, причина/мета оновлення): БЕЗ Confluence-розмітки (без ac:-тегів, без span/p-обгорток) і БЕЗ markdown-огортки \`\`\`. Заголовки можна виділити жирним, списки — звичайним нумерованим/маркованим текстом чату. Мова прев'ю — завжди українська, незалежно від режиму.
      Прев'ю — це буквальне відтворення того, що читач побачить на сторінці Confluence, а НЕ опис чи переказ структури. КАТЕГОРИЧНО заборонені речення-описи на кшталт "Далі — роздільник, під ним expand...", "Мета (перше речення документа):", "Що можна (маркований список з галочками):", "Далі — expand «Назва» з кроками 1-3 (стисло: ...)" — це наратив ПРО документ, який зливається з реальним текстом і плутає читача. Замість цього:
      — Роздільник (<hr/>) — постав буквально рядок "---" у тому місці прев'ю, де він буде в документі.
      — Заголовки розділів, списки, кроки інструкції, приклади, панелі приміток — пиши ПОВНИМ реальним текстом, який буде в фінальній версії, а не переказом його змісту чи формату.
      — Емодзі/ac:emoticon — став буквально ті самі символи, які будуть у коді (✓, 💡, ⭐, 1️⃣ 2️⃣ 3️⃣, ⏳ ✅ ❌ тощо), а не словесний опис "з галочками" чи "з іконками".
      — Єдиний виняток — макроси, яких фізично не можна відтворити текстом чату (expand, кольорові панелі note/info/warning): постав ПЕРЕД відповідним блоком коротку позначку в дужках, напр. "(expand)" чи "(панель Important)", і одразу під нею — увесь реальний текст цього блоку буквально, слово в слово, яким він буде всередині макросу. Позначка в дужках лише сигналізує "це буде згорнуто/у панелі", вона не замінює вміст описом чи стислим переказом — сам вміст завжди пишеться повністю.
   б) Якщо назва документа не надана користувачем — тут-таки, у цьому ж повідомленні, запропонуй 3 короткі варіанти англійською мовою на основі суті чернетки: сухо, по суті, без епітетів і мовних прикрас. Пиши для найширшої аудиторії — НЕ форсуй у назву внутрішню термінологію компанії (напр. "Booster"/"Boosters"/"Colleague"), навіть якщо вона доречна в тілі документа. Суфікс типу документа (Policy/Guide/Process/власний) додавай лише тоді, коли він реально додає ясності.
   в) Якщо це оновлення — стисло, пунктами, перелічи, що саме змінилося по суті відносно старого тексту (бери це з причини/мети оновлення й з наданого нового тексту — не форма, а зміст). Без кольорового підсвічування будь-де.
   г) За потреби — до 3 коротких уточнюючих питань, АЛЕ ЛИШЕ про: додаткові матеріали, яких не могло бути в текстовій формі (чи є конкретні скріншоти/картинки для покрокової інструкції (Блок 7), чи є в користувача конкретні приклади для розділу прикладів (Блок 6), чи є реальні URL для згадок, які логічно мають бути клікабельними (інша політика, дошка в Jira, канал у Slack, форма), без яких лишиться [ЗАПОВНИТИ]); і чутливі грошові дані категорії 2 з розділу ЧУТЛИВІ ГРОШОВІ ДАНІ вище (вартість підписок/сервісів — чи справді потрібно вказувати саме ці цифри). НЕ став запитань про те, що вже написано в формі (причина оновлення, суть змін, чи взагалі щось змінилося) — це вже відомо з чернетки й причини оновлення, повторно не перепитуй. Якщо жодне з цього не актуально — пропусти пункт (г) повністю.
   ґ) Наприкінці запитай, чи все влаштовує, і поясни, що для отримання коду потрібне підтвердження (напр. "Якщо все ок — напиши 'генеруй', і я видам готовий код").
   Це правило діє навіть тоді, коли користувач сам просить "згенеруй фінальний документ" чи "дай код" одразу — сприймай це як команду переходити до цього кроку, а не як команду одразу видати код: прев'ю все одно виводиться першим.
   Виняток — лише коли повідомлення користувача Я ВЖЕ є явним підтвердженням раніше показаного прев'ю — тоді одразу переходь до правила 3, повторне прев'ю не потрібне.
   Якщо після прев'ю користувач просить зміни — онови прев'ю (знову звичайним текстом, без коду) і знову дочекайся підтвердження.

3. Коли отримав явне підтвердження прев'ю — згенеруй ФІНАЛЬНИЙ документ. Перед видачею прогони CHECKLIST з розділу CHECKLIST ПЕРЕД ВИДАЧЕЮ ФІНАЛЬНОГО КОДУ вище.

4. ВИДАЧА КОДУ — ОДНЕ повідомлення, рівно в такому порядку (детальний формат — див. FORMATTING_RULES, розділ ФОРМАТ ВИВОДУ):
   а) Рядок "Фінальний документ:".
   б) Одразу під ним, ДО коду — звичайним текстом без розмітки, стисло, інструкція, що робити далі (саме тут, а НЕ після код-блока — після нього люди вже скопіювали код і не гортають далі). РІВНО 4 пункти; зміст пункту 2 залежить від того, нова це політика чи оновлення чинної (дивись, що користувач обрав на кроці "тип запиту" — покажи ЛИШЕ той варіант, який відповідає обраному, не обидва):
      1. Скопіюй код із блока нижче (кнопка копіювання зверху блока).
      2. Якщо ОНОВЛЕННЯ чинної політики (сторінка вже існує): у Confluence, у режимі редагування сторінки, у правому верхньому куті натисни кнопку <> (Open in source editor).
         Якщо НОВА політика (сторінки ще немає): спершу створи сторінку (Create), впиши назву й будь-який тимчасовий текст у тілі, натисни Save — кнопка <> з'являється лише на вже збереженій сторінці, на порожньому чернетковому драфті її ще немає. Тоді відкрий збережену сторінку знову на редагування — у правому верхньому куті з'явиться кнопка <> (Open in source editor).
      3. Встав туди скопійований код (заміни весь наявний вміст, якщо це оновлення) і натисни <> ще раз, щоб повернутись до звичайного редактора — так коректно розпізнаються макроси, expand і картинки. Звичайний Cmd+V прямо в текст сторінки поза Source Editor зіпсує макроси.
      4. Назва сторінки: {назва} — впиши вручну в поле назви (у тілі документа її немає).
      Це РІВНО ті пункти, які завжди є в цьому списку — не додавай нічого понад них "про всяк випадок" (напр. про скріншоти, вкладення, картинки чи будь-що інше), якщо це не обговорювалося буквально в цій розмові чи не міститься як реальний плейсхолдер у щойно згенерованому коді. Вигаданий чи неактуальний пункт лише збиває людину з пантелику.
      Єдиний можливий додатковий пункт (5.) — лише якщо в коді РЕАЛЬНО лишились нерозв'язані плейсхолдери ([ЗАПОВНИТИ], [SCREENSHOT: опис] тощо): перелічи КОНКРЕТНО ці місця, які людині треба заповнити вручну, і тільки їх. Якщо таких плейсхолдерів немає — не додавай пункт 5 і не пиши жодної фрази на кшталт "плейсхолдерів немає" — просто закінчуй список на пункті 4.
   в) Далі — код-блок \`\`\` ... \`\`\` з усім XHTML, кожен тег на своєму рядку (без відступів, без порожніх рядків між рядками — див. FORMATTING_RULES). Якщо режим BILINGUAL — код одразу містить ОБИДВІ версії: спершу англійський expand "English version" (одразу після роздільника з Блоку 2), одразу за ним — ще один обов'язковий <hr/>, і одразу за ним, без порожнього рядка — уся українська частина. Без додаткових запитань чи окремих кроків — завжди обидві одразу. Код-блоком повідомлення й закінчується.
   Ніяких підводок чи пояснень ПЕРЕД пунктом (а) — саме з нього починається повідомлення.

5. Якщо користувач попросить (пере)перекласти українську версію на англійську (напр. після ручного редагування) — зроби ТОЧНИЙ переклад наданого українського storage format тексту (не дослівний, а еквівалент за змістом і тоном), зберігаючи структуру і ВСІ макроси (ac:structured-macro з унікальними ac:macro-id, ac:emoticon, таблиці, expand, вкладені expand) на відповідних місцях. Назви полів інтерфейсу, статусів, кнопок і проєктів у зовнішніх системах НЕ перекладай. Цей крок без прев'ю. Обгорни переклад у:
<ac:structured-macro ac:macro-id="[НОВИЙ-УНІКАЛЬНИЙ-UUID]" ac:name="expand" ac:schema-version="1"><ac:parameter ac:name="title">English version</ac:parameter><ac:rich-text-body>...переклад...</ac:rich-text-body></ac:structured-macro>
Потім — ще один обов'язковий роздільник <hr/>, і одразу за ним наданий український текст БЕЗ ЗМІН (перший <hr/> вже є на початку документа, перед рядком відповідальної особи — це другий, обов'язковий). Видай результат у тому самому форматі, що й правило 4 (підпис "Фінальний документ:" → інструкція → код-блок).

6. Пиши репліки в чаті (питання, прев'ю, коментарі, підводки) звичайною розмовною українською, стисло, без зайвої формальності — це внутрішній чат з колегою, не офіційний документ. Правила Boosta Tone of Voice та пунктуації з розділів вище стосуються ЛИШЕ тексту самого документа (усередині код-блока), не твоїх реплік.`;

const DOC_TYPES = [
  { key: 'policy', label: 'Політика', desc: 'Загальнохолдингові правила й умови.', suffix: 'Policy' },
  { key: 'guide', label: 'Інструкція / гайд', desc: 'Як користуватись чимось, покрокові дії.', suffix: 'Guide' },
  { key: 'process', label: 'Процес / регламент', desc: 'Регламентована процедура чи workflow.', suffix: 'Process' },
  { key: 'other', label: 'Інше', desc: 'Вкажи власний суфікс назви нижче.', suffix: '' },
];

let s = {
  step: 1,
  mode: 'new',
  docType: 'policy',
  customSuffix: '',
  langMode: 'bilingual',
  ownerEmail: '',
  title: '',
  topic: '',
  changeReason: '',
  oldText: '',
  draftText: '',
  error: '',
  prompt: '', copied: false,
};

const $ = id => document.getElementById(id);
const esc = t => (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function render() {
  const app = $('app');
  app.innerHTML = '';
  if (s.prompt) { renderResult(app); return; }
  renderSteps(app);
  if (s.step===1) step1(app);
  else if (s.step===2) step2(app);
  else if (s.step===3) step3(app);
  else step4(app);
}

function renderSteps(app) {
  let h = '<div class="steps-indicator">';
  ['Тип документа','Мова','Деталі','Чернетка'].forEach((_,i) => {
    const n=i+1, cls=n<s.step?'done':n===s.step?'active':'';
    h += `<div class="step-dot ${cls}">${n<s.step?'✓':n}</div>`;
    if(i<3) h+=`<div class="step-line ${n<s.step?'done':''}"></div>`;
  });
  app.insertAdjacentHTML('beforeend', h+'</div>');
}

function step1(app) {
  app.insertAdjacentHTML('beforeend', `
    <div class="step-label">Крок 1 — Що це за документ</div>
    <div class="radio-row">
      ${DOC_TYPES.map(dt => `
        <label class="radio-card${s.docType===dt.key?' selected':''}" data-dt="${dt.key}">
          <input type="radio" name="doctype" ${s.docType===dt.key?'checked':''}>
          <div><div class="rc-title">${dt.label}</div>
          <div class="rc-desc">${dt.desc}</div></div>
        </label>`).join('')}
    </div>
    ${s.docType==='other' ? `
    <div class="field" style="margin-top:1rem"><label>Свій суфікс назви (англійською)</label>
      <input type="text" id="fSuffix" value="${esc(s.customSuffix)}" placeholder="Наприклад: FAQ, Handbook, Checklist"></div>` : ''}
    <div class="actions"><span></span>
      <button class="btn-primary" id="n1">Далі →</button></div>`);
  document.querySelectorAll('[data-dt]').forEach(el => { el.onclick = () => { s.docType = el.dataset.dt; render(); }; });
  $('n1').onclick = () => {
    if (s.docType==='other') s.customSuffix = ($('fSuffix')?.value || '').trim();
    if (s.docType==='other' && !s.customSuffix) { s.error='Вкажи суфікс назви для "Інше".'; render(); return; }
    s.error=''; s.step=2; render();
  };
}

function step2(app) {
  app.insertAdjacentHTML('beforeend', `
    <div class="step-label">Крок 2 — Мовний режим</div>
    <div class="radio-row">
      <label class="radio-card${s.langMode==='ua_only'?' selected':''}" data-lm="ua_only">
        <input type="radio" name="langmode" ${s.langMode==='ua_only'?'checked':''}>
        <div><div class="rc-title">Тільки українською</div>
        <div class="rc-desc">Зверху буде примітка "This policy is available only for Ukrainian residence."</div></div>
      </label>
      <label class="radio-card${s.langMode==='bilingual'?' selected':''}" data-lm="bilingual">
        <input type="radio" name="langmode" ${s.langMode==='bilingual'?'checked':''}>
        <div><div class="rc-title">Двомовна (UA + EN)</div>
        <div class="rc-desc">Основна робота буде з українською версією політики, чат автоматично перекладе на англійську мову після затвердження фінальних правок.</div></div>
      </label>
    </div>
    <div class="actions">
      <button class="btn-back" id="b2">← Назад</button>
      <button class="btn-primary" id="n2">Далі →</button></div>`);
  document.querySelectorAll('[data-lm]').forEach(el => { el.onclick = () => { s.langMode = el.dataset.lm; render(); }; });
  $('b2').onclick = () => { s.step=1; render(); };
  $('n2').onclick = () => { s.step=3; render(); };
}

function step3(app) {
  app.insertAdjacentHTML('beforeend', `
    <div class="step-label">Крок 3 — Деталі</div>
    ${s.error?`<div class="error-box">${s.error}</div>`:''}
    <div class="radio-row" style="margin-bottom:1.25rem">
      <label class="radio-card${s.mode==='new'?' selected':''}" data-md="new">
        <input type="radio" name="mode" ${s.mode==='new'?'checked':''}>
        <div><div class="rc-title">Новий документ</div></div>
      </label>
      <label class="radio-card${s.mode==='update'?' selected':''}" data-md="update">
        <input type="radio" name="mode" ${s.mode==='update'?'checked':''}>
        <div><div class="rc-title">Оновлення існуючого</div></div>
      </label>
    </div>
    <div class="field"><label>Робочий email відповідальної особи <span style="color:#888"> (ця інформація буде додана на початку документу, щоб бустівці знали, до кого приходити з питаннями)</span></label>
      <input type="text" id="fEmail" value="${esc(s.ownerEmail)}" placeholder="Наприклад: name.surname@boosta.com"></div>
    <div class="field"><label>Назва <span style="color:#888">(необов'язково, якщо маєш труднощі з правильним формулюванням — пропусти, в наступних пунктах Claude запропонує варіанти на основі тексту твого документу)</span></label>
      <input type="text" id="fTitle" value="${esc(s.title)}" placeholder="Наприклад: Time Off Policy"></div>
    <div class="field"><label>Про що ця політика? <span style="color:#888">(необов'язково, 1 речення — допомагає Claude правильно розставити акценти й не загубити суть, особливо в довгих чи багатотемних документах)</span></label>
      <input type="text" id="fTopic" value="${esc(s.topic)}" placeholder="Наприклад: правила спілкування в Slack, email, на зустрічах і в календарі"></div>
    <div class="actions">
      <button class="btn-back" id="b3">← Назад</button>
      <button class="btn-primary" id="n3">Далі →</button></div>`);
  document.querySelectorAll('[data-md]').forEach(el => { el.onclick = () => { s.mode = el.dataset.md; render(); }; });
  $('b3').onclick = () => { s.step=2; render(); };
  $('n3').onclick = () => {
    s.ownerEmail = $('fEmail').value.trim();
    s.title = $('fTitle').value.trim();
    s.topic = $('fTopic').value.trim();
    if (!s.ownerEmail || !s.ownerEmail.includes('@')) { s.error='Вкажи коректний робочий email відповідальної особи.'; render(); return; }
    s.error=''; s.step=4; render();
  };
}

function step4(app) {
  app.insertAdjacentHTML('beforeend', `
    <div class="step-label">Крок 4 — Чернетка</div>
    ${s.error?`<div class="error-box">${s.error}</div>`:''}
    <div class="field"><label>${s.mode==='update' ? 'Причина/мета оновлення' : 'Короткий контекст (навіщо потрібен цей документ)'}</label>
      <textarea id="fReason" placeholder="Наприклад: оновити політику відповідно до темплейту">${esc(s.changeReason)}</textarea>
    </div>
    ${s.mode==='update' ? `
    <div class="field"><label>Поточний текст політики на Confluence
      <span style="color:#888"> (необов'язково, покращує точність аналізу змін)</span></label>
      <div style="font-size:13px;color:#666;line-height:1.6;margin:4px 0 8px">
        Встав один із двох варіантів:
        <ol style="margin:6px 0 0 18px;padding:0">
          <li style="margin-bottom:6px"><strong>Код політики (рекомендовано)</strong> — так Claude бачить форматування, макроси й картинки:
            <ol style="margin:4px 0 0 18px;padding:0">
              <li>У режимі редагування сторінки, у правому верхньому куті, натисни кнопку <code>&lt;&gt;</code> (Open in source editor).</li>
              <li>Виділи весь код — Cmd/Ctrl + A, і скопіюй — Cmd/Ctrl + C.</li>
              <li>Встав його в поле нижче.</li>
            </ol>
          </li>
          <li><strong>Звичайний текст</strong> — просто скопійований видимий текст сторінки. Швидше, але без макросів і картинок.</li>
        </ol>
      </div>
      <textarea class="big" id="fOld" placeholder="Встав код (рекомендовано, через <> Open in source editor) або звичайний текст сторінки">${esc(s.oldText)}</textarea>
    </div>` : ''}
    <div class="field"><label>${s.mode==='update' ? 'Нова політика або перелік змін до поточної політики' : 'Чернетка тексту'}</label>
      ${s.mode==='update' ? `<div style="font-size:13px;color:#666;line-height:1.6;margin:-2px 0 8px">Встав один із двох варіантів: (1) уже оновлений текст правил і політики — Claude сам піджене його під наш темплейт, нічого суттєвого не зміниться; або (2) перелік того, що конкретно треба змінити — напр. "онови відповідно до нового темплейту", "прибери згадку старої назви юніта", "додай пункт про...". Claude сам внесе ці зміни в поточний текст.</div>` : ''}
      <textarea class="big" id="fDraft" placeholder="${s.mode==='update' ? 'Встав новий текст політики або перелік змін, напр. \'онови відповідно до нового темплейту\'' : 'Встав чернетку — необроблений текст, тези, правила, кроки, приклади.'}">${esc(s.draftText)}</textarea>
    </div>
    <div class="tip">Зображення прикріпити тут не можна — якщо чернетка містить скріншоти, додай їх окремим повідомленням прямо в чаті claude.ai після вставки промпту.</div>
    <div class="actions">
      <button class="btn-back" id="b4">← Назад</button>
      <button class="btn-primary" id="gen">Згенерувати промпт ✦</button></div>`);
  $('b4').onclick = () => { s.step=3; render(); };
  $('gen').onclick = () => {
    s.changeReason = $('fReason').value.trim();
    if (s.mode==='update') s.oldText = $('fOld').value.trim();
    s.draftText = $('fDraft').value.trim();
    if (!s.draftText) { s.error='Встав чернетку тексту — без неї нема з чим працювати.'; render(); return; }
    s.error='';
    logUsage();
    buildPrompt();
  };
}

function docTypeSuffix() {
  const dt = DOC_TYPES.find(d => d.key === s.docType);
  return s.docType === 'other' ? s.customSuffix : (dt ? dt.suffix : 'Policy');
}
function docTypeLabel() {
  const dt = DOC_TYPES.find(d => d.key === s.docType);
  return dt ? dt.label : 'Політика';
}

function buildPrompt() {
  const modeLabel = s.mode==='update' ? 'ОНОВЛЕННЯ існуючого документа' : 'СТВОРЕННЯ нового документа';
  const langLabel = s.langMode==='ua_only'
    ? 'UA_ONLY — лише українською, додай примітку "This policy is available only for Ukrainian residence." одразу після роздільника під рядком відповідальної особи'
    : 'BILINGUAL — потрібні обидві мовні версії одразу в першому ж коді (англійська — в expand "English version", українська — в тілі), без додаткових запитань щодо порядку.';

  let intake = `Тип запиту: ${modeLabel}
Тип документа: ${docTypeLabel()} (суфікс назви: "${docTypeSuffix()}")
Мовний режим: ${langLabel}
Email відповідальної особи: ${s.ownerEmail}
${s.title ? `Назва документа: ${s.title} (якщо назва вже закінчується суфіксом типу документа — не додавай суфікс вдруге)` : 'Назва документа: не надана — запропонуй 3 варіанти згідно з ПРАВИЛАМИ ВЗАЄМОДІЇ і почекай мого вибору.'}`;
  if (s.topic) intake += `\nПро що ця політика (коротко): ${s.topic} — використовуй це формулювання, щоб правильно розставити акценти й не загубити фокус, особливо якщо чернетка довга чи стосується кількох тем.`;
  if (s.changeReason) intake += `\nКонтекст / мета: ${s.changeReason}`;
  if (s.mode==='update') {
    intake += `\nСписок змін по суті перед кодом: так, пунктами в прев'ю, без кольору в самому документі (це базове налаштування, завжди так)`;
    if (s.oldText) intake += `\n\n=== ПОТОЧНИЙ ТЕКСТ (для порівняння) ===\n${s.oldText}`;
  }
  intake += `\n\n=== ЧЕРНЕТКА ===\n${s.draftText}`;

  s.prompt = `Ти — асистент із внутрішніх комунікацій Boosta, що оформлює документи (політики, гайди, процеси) для Confluence Data Center 7.13.2 за єдиним темплейтом компанії і суворо в межах Boosta Tone of Voice. Дотримуйся структури й усіх правил нижче без винятків. Це чат — став уточнюючі питання, коли потрібно, і чекай моїх відповідей, перш ніж видавати фінальний документ.

${BOOSTA_CONTEXT}

${BOOSTA_TOV}

${POLICY_TEMPLATE}

${FORMATTING_RULES}

${INTERACTION_RULES}

=== МІЙ ЗАПИТ ===
${intake}`;

  render();
}

function renderResult(app) {
  const escaped = s.prompt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  app.insertAdjacentHTML('beforeend', `
    <p style="font-size:15px;font-weight:500;margin-bottom:1.25rem">Промпт готовий — далі кроки:</p>
    <div class="instruction-step">
      <span class="step-badge">1</span>
      <p>Скопіюй промпт нижче й встав у <a href="https://claude.ai" target="_blank">claude.ai</a> як перше повідомлення нового чату</p>
    </div>
    <div class="instruction-step">
      <span class="step-badge">2</span>
      <p>Claude відповість або уточнюючими питаннями, або одразу прев'ю — продовжуй розмову звичайними повідомленнями в тому ж чаті; для двомовного режиму обидві мови прийдуть в одному коді автоматично, окремо просити не треба</p>
    </div>
    <div class="instruction-step">
      <span class="step-badge">3</span>
      <p>Коли Claude напише "Фінальний документ:" — одразу під написом буде інструкція, що робити далі, а вже під нею код-блок: натисни кнопку копіювання в його кутку</p>
    </div>
    <div class="prompt-block">
      <textarea class="prompt-text" id="promptOut" rows="14" readonly>${escaped}</textarea>
    </div>
    <div class="result-actions">
      <button class="btn-copy" id="cp">Скопіювати промпт</button>
      <a class="btn-open" href="https://claude.ai" target="_blank">Відкрити Claude.ai ↗</a>
      <button class="btn-ghost" id="rs">Новий запит</button>
    </div>
    <div class="insert-instructions">
      <div class="ii-title">Як вставити фінальний текст у Confluence:</div>
      <ol>
        <li>У режимі редагування сторінки, у правому верхньому куті, натисни кнопку <code>&lt;&gt;</code> (Open in source editor).</li>
        <li>Встав туди скопійований код (заміни весь наявний вміст, якщо це оновлення) і натисни <code>&lt;&gt;</code> ще раз, щоб повернутись до звичайного редактора. ⚠️ Звичайний Cmd+V прямо в текст сторінки поза Source Editor зіпсує макроси (іконки, панель Important) — Confluence проігнорує теги.</li>
        <li>Клікни в рядок з email відповідальної особи, стери текст, введи <code>@</code> і перші літери імені — Confluence запропонує реальний тег людини (це не робиться автоматично).</li>
        <li>Перевір плейсхолдери <code>[SCREENSHOT: ...]</code> і <code>[ЗАПОВНИТИ]</code>, якщо вони є, і онови на реальний вміст.</li>
      </ol>
    </div>
    <div class="divider"></div>
    <p style="text-align:center; font-style:italic; font-size:11px; color:#999; margin-top:1.5rem">Powered by Comms Team 🧡</p>`);

  $('promptOut').onclick = () => $('promptOut').select();
  $('cp').onclick = () => {
    navigator.clipboard.writeText(s.prompt).then(()=>{
      $('cp').textContent = 'Скопійовано ✓';
      $('cp').classList.add('copied');
      setTimeout(()=>{ $('cp').textContent='Скопіювати промпт'; $('cp').classList.remove('copied'); }, 2200);
    });
  };
  $('rs').onclick = () => {
    Object.assign(s, { step:1, mode:'new', docType:'policy', customSuffix:'', langMode:'bilingual',
      ownerEmail:'', title:'', topic:'', changeReason:'', oldText:'', draftText:'',
      error:'', prompt:'', copied:false });
    render();
  };
}

render();
</script>
</body>
</html>
